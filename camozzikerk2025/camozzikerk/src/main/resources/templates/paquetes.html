<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Paquetes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        main {
            margin: 20px auto;
            padding: 20px;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        form input, form select, form button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        form button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
        }
        form button:hover {
            background-color: #0056b3;
        }

        .botonInicio {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            display: block;
            width: 200px;
            margin: 20px auto;
        }

        .botonInicio:hover {
            background-color: #0056b3;
        }

        .paquete-item {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .paquete-item p {
            margin: 5px 0;
        }
        .paquete-item button {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .paquete-item button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Paquetes</h1>
    </header>
    <main>
        <!-- Mensajes de éxito o error -->
        <div th:if="${success}" style="color: green;">[[${success}]]</div>
        <div th:if="${error}" style="color: red;">[[${error}]]</div>
    
        <!-- Formulario para agregar un paquete -->
        <form th:action="@{/paquetes}" method="post">
            <label for="origen">Origen:</label>
            <select name="origen.id" id="origen" required>
                <option value="" disabled selected>Selecciona una ciudad de origen</option>
                <option th:each="ciudad : ${ciudades}" 
                        th:value="${ciudad.id}" 
                        th:text="${ciudad.ciudad} + ' - ' + ${ciudad.provincia.nombre}"></option>
            </select>

           
			
			<label for="destino">Ciudad de Destino:</label>
			<select name="destino.id" id="destino" required>
			    <option value="" disabled selected>Selecciona una ciudad de destino</option>
			    <option th:each="ciudad : ${ciudades}" 
			            th:value="${ciudad.id}" 
			            th:text="${ciudad.ciudad} + ' - ' + ${ciudad.provincia.nombre}"></option>
			</select>


            <input type="number" name="peso" placeholder="Peso (kg)" required>
            <label for="fragil">¿Es frágil?</label>
            <select name="fragil" id="fragil" required>
                <option value="true">Sí</option>
                <option value="false">No</option>
            </select>
            <input type="text" name="dniRemitente" placeholder="DNI Remitente" maxlength="8" pattern="\d{8}" required>
            <input type="text" name="dniDestinatario" placeholder="DNI Destinatario" maxlength="8" pattern="\d{8}" required>
            <button type="submit">Agregar Paquete</button>
        </form>

        <!-- Lista de paquetes -->
        <div th:each="paquete : ${paquetes}" class="paquete-item">
            <p><strong>Remitente DNI:</strong> <span th:text="${paquete.remitente.dni}"></span></p>
            <p><strong>Destino:</strong> <span th:text="${paquete.destino.ciudad} + ' - ' + ${paquete.destino.provincia.nombre}"></span></p>
            <p><strong>Peso:</strong> <span th:text="${paquete.peso}"></span> kg</p>
            <p><strong>Frágil:</strong> <span th:text="${paquete.fragil ? 'Sí' : 'No'}"></span></p>
            <form th:action="@{/paquetes/eliminar/{id}(id=${paquete.id})}" method="post">
                <button type="submit">Eliminar</button>
            </form>
        </div>

        <!-- Si no hay paquetes disponibles -->
        <div th:if="${#lists.isEmpty(paquetes)}">
            <p>No hay paquetes disponibles.</p>
        </div>

        <!-- Botón para volver al índice -->
        <button class="botonInicio" type="button" onclick="window.location.href='/'">Volver al Inicio</button>
    </main>
</body>
</html>
