<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación de Camiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
	.botonInicio {
			            background-color: #007BFF;
			            color: white;
			            cursor: pointer;
			            border: none;
			            padding: 10px;
			            border-radius: 5px;
			            font-size: 16px;
			            display: block;
			            width: 200px; /* Define un ancho fijo */
			            margin: 20px auto; /* Centra el botón horizontalmente */
			        }

			        .botonInicio:hover {
			            background-color: #0056b3;
			        }
</style>
	
	
	
</head>
<body>
    <div class="container mt-5">
        <h1>Gestión de Ubicación de Camiones</h1>
        <form action="/camiones/ubicacion" method="get" class="mb-3">
            <div class="row">
                <div class="col-md-6">
                    <label for="patente" class="form-label">Buscar por Patente</label>
                    <input type="text" id="patente" name="patente" class="form-control" placeholder="Ingrese parte de la patente">
                </div>
                <div class="col-md-6">
                    <label for="codigoPostal" class="form-label">Buscar por Código Postal</label>
					<input type="number" id="codigoPostal" name="codigoPostal" class="form-control" placeholder="Ingrese el código postal">

                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Buscar</button>
        </form>
        <h2>Lista de Camiones</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patente</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ciudad Actual</th>
                </tr>
            </thead>
            <tbody>
                <!-- Thymeleaf renderizará los camiones aquí -->
                <tr th:each="camion : ${camiones}">
                    <td th:text="${camion.id}"></td>
                    <td th:text="${camion.patente}"></td>
                    <td th:text="${camion.marca}"></td>
                    <td th:text="${camion.modelo}"></td>
                    <td th:text="${camion.ciudadActual.id}"></td>
                </tr>
            </tbody>
        </table>
    </div>
	
	<!-- Botón para volver al índice -->
	<button class="botonInicio" type="button" onclick="window.location.href='/'">Volver al Inicio</button>

	    </main>
	
</body>
</html>
