<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Caminos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .botonInicio {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            display: block;
            width: 200px;
            margin: 20px auto;
        }
        .botonInicio:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Consulta de Caminos</h1>
        <form action="/consultar-caminos" method="post" class="mb-3">
            <div class="mb-3">
                <label for="codigoPostal" class="form-label">Código Postal (4 dígitos):</label>
                <input type="text" id="codigoPostal" name="codigoPostal" class="form-control" maxlength="4" pattern="\d{4}" title="Debe ingresar exactamente 4 dígitos" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Consultar Caminos</button>
        </form>
        <h2 class="text-center">Resultados</h2>
        <div id="resultados" class="border p-3 bg-light text-center">
            <!-- Los resultados se mostrarán aquí -->
        </div>
    </div>
    <button class="botonInicio" type="button" onclick="window.location.href='/'">Volver al Inicio</button>
</body>
</html>
