<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        main {
            margin: 20px auto;
            padding: 20px;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        form input, form button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        form button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
        }
        form button:hover {
            background-color: #0056b3;
        }
        .botonInicio {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            display: block;
            width: 200px;
            margin: 20px auto;
        }
        .botonInicio:hover {
            background-color: #0056b3;
        }
        .cliente-item {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .cliente-item p {
            margin: 5px 0;
        }
        .cliente-item button {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .cliente-item button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Clientes</h1>
    </header>
    <main>
        <!-- Mensajes de éxito o error -->
        <div th:if="${success}" style="color: green;">[[${success}]]</div>
        <div th:if="${error}" style="color: red;">[[${error}]]</div>
        
        <!-- Formulario para agregar un cliente -->
        <form th:action="@{/clientes/agregar}" method="post">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="text" name="apellido" placeholder="Apellido" required>
            <input type="number" name="dni" placeholder="DNI" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Agregar Cliente</button>
        </form>

        <!-- Lista de clientes -->
        <div th:each="cliente : ${clientes}" class="cliente-item">
            <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
            <p><strong>Apellido:</strong> <span th:text="${cliente.apellido}"></span></p>
            <p><strong>DNI:</strong> <span th:text="${cliente.dni}"></span></p>
            <p><strong>Email:</strong> <span th:text="${cliente.email}"></span></p>
            <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                <button type="submit">Eliminar</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(clientes)}">
            <p>No hay clientes disponibles.</p>
        </div>

        <!-- Botón para volver al índice -->
        <button class="botonInicio" type="button" onclick="window.location.href='/'">Volver al Inicio</button>

    </main>
</body>
</html>
